<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it iOS reports env(safe-area-inset-*)
         as 0, and the mobile bottom tab bar / bottom sheets could not pad
         themselves above the home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AI Data Intelligence Platform</title>
    <meta name="description" content="Upload datasets, explore their schema and quality, and ask questions of your data." />
    <meta name="theme-color" content="#183D30" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The Latin subset covers the app's own UI text; preloaded so the
         first paint already uses it. JetBrains Mono is not preloaded: it
         is only used for code-like content and loads on demand. -->
    <link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
